<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>kbserve</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#f4f5f7;--panel:#fff;--line:#e1e4e8;--fg:#1c2733;--dim:#5c6b7a;--acc:#3b6fe0;--acc-txt:#1d4fb8;--on-acc:#fff;--good:#2e9e62;--warn:#b8811b;--bad:#d4524d;--hover:#eef2f8;--radius:10px;--shadow:0 1px 3px rgba(0,0,0,.08)}
[data-theme="dark"]{--bg:#0f1115;--panel:#171a21;--line:#262b36;--fg:#d7dbe2;--dim:#8b93a3;--acc:#5b8def;--acc-txt:#9ec2ff;--on-acc:#fff;--good:#4caf7d;--warn:#d9a13b;--bad:#e2605b;--hover:#1c2130;--shadow:0 1px 3px rgba(0,0,0,.3)}
body{font:14px/1.5 -apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--fg);min-height:100vh}
header{background:var(--panel);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;align-items:center;gap:8px;position:sticky;top:0;z-index:10;flex-wrap:wrap}
header h1{font-size:16px;color:var(--fg);margin:0}
header .sub{color:var(--dim);font-size:12px}
header nav{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
header nav button{background:transparent;border:1px solid var(--line);padding:5px 12px;border-radius:6px;cursor:pointer;font-size:12px;color:var(--dim);white-space:nowrap}
header nav button.active{background:var(--acc);color:var(--on-acc);border-color:var(--acc)}
header .hdr-actions{display:flex;gap:6px;margin-left:auto}
header .hdr-actions button{background:transparent;border:1px solid var(--line);padding:5px 10px;border-radius:6px;cursor:pointer;font-size:11px;color:var(--dim)}
main{display:flex;min-height:0;height:calc(100vh - 54px)}
.pane{display:none;flex:1;overflow-y:auto;padding:12px}
.pane.active{display:block}
.max-w{max-width:960px;margin:0 auto}
h2{font-size:15px;margin:0 0 12px;color:var(--fg)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;margin-bottom:10px}
.card h3{font-size:13px;color:var(--fg);margin:0 0 8px}
.card .meta{color:var(--dim);font-size:12px;margin-bottom:6px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-bottom:12px}
.stat-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:12px;text-align:center}
.stat-card b{display:block;font-size:24px;color:var(--fg);line-height:1.3}
.stat-card span{font-size:12px;color:var(--dim)}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--dim);font-weight:500;font-size:12px}
tr:hover{background:var(--hover)}
.tag{display:inline-block;padding:1px 8px;border-radius:99px;font-size:11px;margin-right:4px;white-space:nowrap}
.tag-active{background:#d9f0e2;color:var(--good)}
.tag-pending{background:#fbe9d0;color:var(--warn)}
.tag-archived,.tag-rejected{background:#f7dcdb;color:var(--bad)}
.btn{display:inline-flex;align-items:center;gap:4px;padding:5px 12px;border-radius:6px;border:1px solid var(--line);background:transparent;color:var(--dim);cursor:pointer;font-size:12px;text-decoration:none}
.btn:hover{color:var(--fg);border-color:var(--acc)}
.btn-p{background:var(--acc);color:var(--on-acc);border-color:var(--acc)}
.btn-p:hover{filter:brightness(1.1)}
.btn-d{color:var(--bad);border-color:var(--bad)}
.btn-d:hover{background:var(--bad);color:var(--on-acc)}
.btn-sm{padding:3px 8px;font-size:11px}
input,textarea,select{padding:7px 10px;border:1px solid var(--line);border-radius:6px;font-size:13px;background:var(--panel);color:var(--fg);width:100%}
textarea{resize:vertical;min-height:60px}
form{display:flex;flex-direction:column;gap:8px;max-width:100%}
.form-row{display:flex;gap:8px;flex-wrap:wrap}
.form-row>*{flex:1;min-width:140px}
.empty{padding:20px;text-align:center;color:var(--dim)}
pre{white-space:pre-wrap;font-size:12px;max-height:300px;overflow:auto;padding:10px;background:var(--bg);border-radius:6px;color:var(--fg)}
#chatBox{display:flex;flex-direction:column;height:calc(100vh - 100px);max-width:680px;margin:0 auto}
#chatMsgs{flex:1;overflow-y:auto;padding:8px 0;display:flex;flex-direction:column;gap:6px}
.msg{padding:10px 14px;border-radius:12px;max-width:88%;word-break:break-word;font-size:14px;line-height:1.6}
.msg-user{background:var(--acc);color:var(--on-acc);align-self:flex-end;border-bottom-right-radius:4px}
.msg-ai{background:var(--panel);border:1px solid var(--line);align-self:flex-start;border-bottom-left-radius:4px}
.msg .time{font-size:10px;color:var(--dim);margin-top:4px;opacity:.7}
.msg .sources{font-size:11px;color:var(--dim);margin-top:6px;padding-top:6px;border-top:1px solid var(--line)}
.msg .feedback{display:flex;gap:6px;margin-top:6px}
.msg .feedback button{background:transparent;border:1px solid var(--line);border-radius:4px;cursor:pointer;padding:3px 10px;font-size:11px;color:var(--dim)}
.msg .feedback button.active{background:var(--acc);color:var(--on-acc);border-color:var(--acc)}
.chat-inp{display:flex;gap:8px;padding:10px 0;border-top:1px solid var(--line);background:var(--bg)}
.chat-inp input{flex:1;padding:10px 14px;border:1px solid var(--line);border-radius:8px;font-size:14px}
.chat-inp button{background:var(--acc);color:var(--on-acc);border:0;padding:10px 20px;border-radius:8px;cursor:pointer;font-size:14px}
.chat-inp button:disabled{opacity:.5}
@media(max-width:640px){header{padding:8px 12px}header h1{font-size:14px}header nav button{padding:4px 8px;font-size:11px}.stats{grid-template-columns:repeat(2,1fr)}.stat-card b{font-size:20px}#chatBox{height:calc(100vh - 80px)}.msg{max-width:95%;font-size:13px}}
</style>
</head>
<body>
<header>
  <h1>kbserve</h1>
  <span class="sub" id="sub">-</span>
  <div class="hdr-actions">
    <button id="themeBtn" onclick="toggleTheme()">日间</button>
    <button onclick="switchMain('chat')">客服</button>
    <button id="adminBtn" onclick="switchMain('admin')">管理</button>
  </div>
</header>
<main>
  <section class="pane active" id="pane-chat">
    <div id="chatBox">
      <div id="chatMsgs">
        <div class="msg msg-ai" id="greetingMsg">您好！</div>
      </div>
      <div class="chat-inp">
        <input id="qInput" placeholder="输入问题..." onkeydown="if(event.key==='Enter') ask()">
        <button id="qBtn" onclick="ask()">发送</button>
      </div>
    </div>
  </section>
  <section class="pane" id="pane-admin">
    <div class="max-w">
      <div id="adminNav" style="display:flex;gap:4px;flex-wrap:wrap;margin-bottom:10px"></div>
      <div id="adminContent" class="empty">加载中…</div>
    </div>
  </section>
</main>
<script>
const BASE = "";
let __lang = "zh", activeMainTab = "chat", adminTab = "dashboard", adminToken = "", adminUser = null;

try { adminToken = localStorage.getItem("kbserve_admin_token") || "" } catch {}

async function checkAuth(){
  if(adminToken){
    const r = await fetch(BASE+"/auth/me",{headers:{"Authorization":"Bearer "+adminToken}}).then(r=>r.json());
    if(r.ok){ adminUser = r.user; return true }
    adminToken = ""; localStorage.removeItem("kbserve_admin_token");
  }
  return showLogin();
}
function showLogin(){
  const box = document.getElementById("adminContent");
  box.innerHTML = `<div class=card style="max-width:400px;margin:40px auto"><h3>${_l("管理员登录","Admin Login")}</h3>
    <form onsubmit="return doLogin(event)">
      <input id="loginUser" value="admin" placeholder="${_l("用户名","Username")}">
      <input id="loginPass" type="password" placeholder="${_l("密码","Password")}">
      <button class="btn btn-p">${_l("登录","Login")}</button>
    </form><div id="loginErr" style="color:var(--bad);font-size:12px;margin-top:4px"></div></div>`;
  return false;
}
async function doLogin(e){
  e.preventDefault();
  const r = await fetch(BASE+"/auth/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:document.getElementById("loginUser").value,password:document.getElementById("loginPass").value})}).then(r=>r.json());
  if(r.ok){ adminToken = r.token; adminUser = r.user; localStorage.setItem("kbserve_admin_token",adminToken); renderAdmin(); return false }
  document.getElementById("loginErr").textContent = r.error || "Login failed";
  return false;
}
async function doLogout(){
  await fetch(BASE+"/auth/logout",{method:"POST",headers:{"Authorization":"Bearer "+adminToken}}).catch(()=>{});
  adminToken = ""; adminUser = null; localStorage.removeItem("kbserve_admin_token");
  showLogin();
}
async function post(p,b){
  const headers = {"Content-Type":"application/json"};
  if(adminToken) headers["Authorization"] = "Bearer "+adminToken;
  return (await fetch(BASE+p,{method:"POST",headers,body:JSON.stringify(b||{})})).json();
}
async function get(p){
  const headers = {};
  if(adminToken) headers["Authorization"] = "Bearer "+adminToken;
  return (await fetch(BASE+p,{headers})).json();
}

// Real-time notifications via SSE
let notifCount = 0;
function connectSSE(){
  const evtSource = new EventSource(BASE+"/events");
  evtSource.onmessage = (e) => {
    try{
      const data = JSON.parse(e.data);
      if(data.type === "feedback"){
        notifCount++;
        updateNotifBadge();
        if(confirm(`[${_l("新反馈","New Feedback")}] ${data.message}\n${_l("查看？","View?")}`)) switchAdmin("feedback");
      }
    }catch{}
  };
  evtSource.onerror = () => setTimeout(connectSSE, 5000);
}
function updateNotifBadge(){
  const btn = document.querySelector('[data-tab="feedback"]');
  if(btn) btn.innerHTML = (__lang==="zh"?"反馈":"Feedback") + (notifCount ? ` (${notifCount})` : "");
}
setTimeout(connectSSE, 1000);
try { __lang = localStorage.getItem("kbserve_lang") || (navigator.language||"").startsWith("zh")?"zh":"en" } catch {}
function _l(z,e){return __lang==="zh"?z:e}
function toggleTheme(){const d=document.documentElement;const t=d.getAttribute("data-theme")==="dark"?"light":"dark";d.setAttribute("data-theme",t);localStorage.setItem("kbserve_theme",t);document.getElementById("themeBtn").textContent=_l(t==="light"?"日间":"夜间",t==="light"?"Light":"Dark")}
(function(){try{const t=localStorage.getItem("kbserve_theme")||"light";document.documentElement.setAttribute("data-theme",t);document.getElementById("themeBtn").textContent=_l(t==="light"?"日间":"夜间",t==="light"?"Light":"Dark")}catch{}})()

// API helpers
async function get(p){return(await fetch(BASE+p)).json()}
async function post(p,b){return(await fetch(BASE+p,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(b||{})})).json()}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}

// Switch main
function switchMain(tab){
  activeMainTab=tab;
  document.querySelectorAll(".pane").forEach(p=>p.classList.remove("active"));
  document.getElementById("pane-"+tab).classList.add("active");
  document.querySelectorAll("header .hdr-actions button").forEach(b=>b.classList.remove("active"));
  document.getElementById(tab==="chat"?"adminBtn":"chatBtn").classList.remove("active");
  document.getElementById(tab==="chat"?"chatBtn":"adminBtn").classList.remove("active");
  if(tab==="admin")renderAdmin();
  else if(tab==="chat")loadGreeting();
}
document.getElementById("adminBtn").addEventListener("click",()=>switchMain("admin"));
switchMain("chat");

// === Chat ===
let convId = null;
async function loadGreeting(){
  try{const p=await get("/admin/persona/get");if(p.greeting)document.getElementById("greetingMsg").textContent=p.greeting;document.getElementById("sub").textContent=p.name||"kbserve"}catch{}
}
async function ask(){
  const q=document.getElementById("qInput").value.trim();if(!q)return;
  const btn=document.getElementById("qBtn");btn.disabled=true;btn.textContent="…";
  addMsg(q,"user");document.getElementById("qInput").value="";
  const res=await post("/qa",{question:q,userId:"chat-"+(convId||"anon")});
  if(!convId){const c=await post("/conv/start",{userId:"chat-"+Date.now(),title:q.slice(0,40)});convId=c.id}
  addMsg(res.answer||res.error||"无回答","ai",res.sources,res.error);
  btn.disabled=false;btn.textContent="发送";
}
function addMsg(text,role,sources,error){
  const box=document.getElementById("chatMsgs");
  const div=document.createElement("div");div.className="msg msg-"+role;
  div.textContent=text;
  if(sources&&sources.length){const s=document.createElement("div");s.className="sources";s.textContent=_l("来源:","Sources:")+sources.map(x=>x.title).join(", ");div.appendChild(s)}
  if(error){const e=document.createElement("div");e.style.cssText="color:var(--bad);font-size:12px;margin-top:4px";e.textContent=error;div.appendChild(e)}
  if(role==="ai"&&text){const fb=document.createElement("div");fb.className="feedback";fb.innerHTML='<button onclick="rate(5,this)">👍</button><button onclick="rate(1,this)">👎</button>';fb.dataset.q=text;fb.dataset.a=text;div.appendChild(fb)}
  box.appendChild(div);box.scrollTop=box.scrollHeight;
}
async function rate(v,btn){
  const fb=btn.closest(".feedback");
  await post("/qa/feedback",{question:fb.dataset.q,answer:fb.dataset.a,rating:v,userId:"chat-"+(convId||""),conversationId:convId});
  fb.querySelectorAll("button").forEach(b=>b.classList.remove("active"));btn.classList.add("active");
}

// === Admin ===
const TABS={dashboard:"概览|Dashboard",kb:"知识库|KB",import:"导入|Import",qa:"QA审核|QA Review",feedback:"反馈|Feedback",users:"用户|Users",sandbox:"沙箱|Sandbox",persona:"人设|Persona",provider:"模型|Provider",platform:"平台|Platform",plugins:"插件|Plugins",marketplace:"市场|Marketplace",export:"导出|Export",reports:"报告|Reports",docs:"API文档|API Docs"};
function switchAdmin(t){
  adminTab=t;renderAdmin();
  document.querySelectorAll("#adminNav button").forEach(b=>b.classList.remove("active"));
  document.querySelector(`#adminNav button[data-tab="${t}"]`)?.classList.add("active");
}
async function renderAdmin(){
  if(!await checkAuth()){document.getElementById("adminContent").innerHTML=`<div class=card><h3>${_l("需要认证","Auth Required")}</h3><div class=panel-body><p>${_l("请输入管理员令牌访问管理后台。","Enter admin token to access the management panel.")}</p><button class="btn btn-p" onclick="renderAdmin()">${_l("重试","Retry")}</button></div></div>`;return}
  const nav=document.getElementById("adminNav"),box=document.getElementById("adminContent");
  nav.innerHTML=Object.entries(TABS).map(([k,v])=>`<button data-tab="${k}" onclick="switchAdmin('${k}')" style="background:${adminTab===k?'var(--acc)':'transparent'};color:${adminTab===k?'var(--on-acc)':'var(--dim)'};border:1px solid var(--line);padding:5px 10px;border-radius:6px;cursor:pointer;font-size:12px;white-space:nowrap">${__lang==="zh"?v.split("|")[0]:v.split("|")[1]}</button>`).join("");
  switch(adminTab){
    case"dashboard":renderDash(box);break;
    case"kb":renderKb(box);break;
    case"import":renderImport(box);break;
    case"qa":renderQa(box);break;
    case"feedback":renderFeedback(box);break;
    case"users":renderUsers(box);break;
    case"sandbox":renderSandbox(box);break;
    case"persona":renderPersona(box);break;
    case"provider":renderProvider(box);break;
    case"platform":renderPlatform(box);break;
    case"plugins":renderPlugins(box);break;
    case"marketplace":renderMarketplace(box);break;
    case"export":renderExport(box);break;
    case"docs":renderDocs(box);break;
    case"reports":renderReports(box);break;
  }
}
async function renderDash(box){
  const s=await get("/admin/stats");
  box.innerHTML=`<div class=stats>
    <div class=stat-card><b>${s.kbCount||0}</b><span>${_l("知识库","KB Docs")}</span></div>
    <div class=stat-card><b>${s.conversations||0}</b><span>${_l("会话","Conversations")}</span></div>
    <div class=stat-card><b>${s.users||0}</b><span>${_l("用户","Users")}</span></div>
    <div class=stat-card><b>${s.pendingFeedback||0}</b><span>${_l("待处理反馈","Pending")}</span></div>
    <div class=stat-card><b>${s.pendingQa||0}</b><span>${_l("待审核QA","QA Pending")}</span></div>
    <div class=stat-card><b>${s.todayConvs||0}</b><span>${_l("今日会话","Today")}</span></div>
    <div class=stat-card><b>${Number(s.avgRating||0).toFixed(1)}</b><span>${_l("平均评分","Avg Rating")}</span></div>
  </div>
  <div class=card><h3>${_l("系统信息","System Info")}</h3>
    <div style="font-size:12px;color:var(--dim)"><span id="sysInfo"></span></div>
  </div>`;
  try{const h=await get("/health");document.getElementById("sysInfo").innerHTML=_l(`PID: ${h.pid} · 插件: ${h.plugins||0} 个`,"PID: "+h.pid+" · Plugins: "+(h.plugins||0))}catch{}
}
async function renderImport(box){
  const dir=await get("/admin/import/dir");
  box.innerHTML=`<div class=card><h3>${_l("批量导入","Batch Import")}</h3>
    <p style="font-size:12px;color:var(--dim);margin-bottom:8px">
    ${_l("支持的文件格式: .md (Markdown)、.txt、.csv (第一列标题,第二列内容)、.pdf (需安装 pdftotext)","Supported: .md, .txt, .csv, .pdf (requires pdftotext)")}
    </p>
    <div class=meta>${_l("导入目录","Import dir")}: <code>${esc(dir.path||"")}</code></div>
    <p style="font-size:12px;color:var(--dim);margin-top:8px">${_l("将文件放入上述目录，然后点击「执行导入」。","Place files in the directory above, then click 'Import'.")}</p>
    <div class=form-row style="margin-top:8px">
      <input id="importTags" placeholder="${_l("标签","Tags")}">
      <button class="btn btn-p" onclick="runImport()">${_l("执行导入","Import")}</button>
    </div>
    <div id="importResult" style="margin-top:8px"></div>
  </div>`;
}
async function runImport(){
  const box=document.getElementById("importResult");
  box.innerHTML=`<div class=empty>${_l("导入中…","Importing…")}</div>`;
  const r=await post("/admin/import",{tags:document.getElementById("importTags")?.value||""});
  let h=`<div class=meta>${_l("总计","Total")}: ${r.total} | ${_l("成功","OK")}: ${r.succeeded} | ${_l("失败","Failed")}: ${r.failed}</div>`;
  if(r.docs&&r.docs.length){
    h+=`<table><tr><th>${_l("文件","File")}</th><th>${_l("状态","Status")}</th></tr>`;
    for(const d of r.docs.slice(0,20))h+=`<tr><td>${esc(d.title)}</td><td>${esc(d.status)}</td></tr>`;
    if(r.docs.length>20)h+=`<tr><td colspan=2><span class=meta>... ${r.docs.length-20} ${_l("更多","more")}</span></td></tr>`;
    h+=`</table>`;
  }
  box.innerHTML=h;
}
async function renderKb(box){
  const docs=await get("/admin/kb/list");
  box.innerHTML=`<div class=card><h3>${_l("添加文档","Add Document")}</h3>
    <form onsubmit="return addKb(event)">
      <input id="kbTitle" placeholder="${_l("标题","Title")}" required>
      <textarea id="kbContent" rows=4 placeholder="${_l("内容","Content")}" required></textarea>
      <input id="kbTags" placeholder="${_l("标签（逗号分隔）","Tags (comma)")}">
      <button class="btn btn-p">${_l("添加","Add")}</button>
    </form></div>`;
  if(docs.length){
    let h=`<div class=card><div class=table-wrap><table><tr><th>${_l("标题","Title")}</th><th>${_l("状态","Status")}</th><th>${_l("版本","Ver")}</th><th>${_l("操作","Actions")}</th></tr>`;
    for(const d of docs){
      h+=`<tr><td><b>${esc(d.title)}</b><div class=meta>${esc((d.content||"").slice(0,60))}…</div></td>
        <td><span class="tag tag-${d.status}">${d.status}</span></td><td>v${d.version}</td>
        <td><button class="btn btn-sm btn-d" onclick="deleteKb(${d.id})">${_l("删除","Del")}</button></td></tr>`;
    }
    box.innerHTML+=h+`</table></div></div>`;
  }else box.innerHTML+=`<div class=card><div class=empty>${_l("暂无文档","No documents")}</div></div>`;
}
async function renderQa(box){
  const qas=await get("/admin/qa/list");
  box.innerHTML=`<div class=card><h3>${_l("QA审核","QA Review")}</h3>`;
  if(qas.length){
    let h=`<div class=table-wrap><table><tr><th>${_l("问题","Question")}</th><th>${_l("回答","Answer")}</th><th>${_l("状态","Status")}</th><th>${_l("操作","Actions")}</th></tr>`;
    for(const q of qas){
      h+=`<tr><td>${esc((q.question||"").slice(0,50))}</td><td>${esc((q.answer||"").slice(0,50))}</td>
        <td><span class="tag tag-${q.status}">${q.status}</span></td>
        <td>${q.status==="pending"?`<button class="btn btn-sm" style="color:var(--good)" onclick="approveQa(${q.id})">${_l("通过","Approve")}</button><button class="btn btn-sm btn-d" onclick="rejectQa(${q.id})">${_l("拒绝","Reject")}</button>`:""}</td></tr>`;
    }
    box.innerHTML+=h+`</table></div></div>`;
  }else box.innerHTML+=`<div class=empty>${_l("暂无QA记录","No QA pairs")}</div></div>`;
}
async function renderFeedback(box){
  const fb=await get("/admin/feedback");
  box.innerHTML=`<div class=card><h3>${_l("待处理反馈","Pending Feedback")}</h3>`;
  if(fb.length){
    let h=`<div class=table-wrap><table><tr><th>${_l("问题","Question")}</th><th>${_l("评分","Rating")}</th><th>${_l("评论","Comment")}</th><th>${_l("操作","Actions")}</th></tr>`;

async function renderSandbox(box){
  box.innerHTML=`<div class=card><h3>${_l("代码沙箱","Code Sandbox")}</h3>
    <p style="font-size:12px;color:var(--dim);margin-bottom:8px">
      ${_l("安全执行 LLM 生成的 JavaScript。沙箱内无 process/require/fs 访问，默认禁联网，超时自动终止。","Safely run LLM-generated JavaScript. No process/require/fs access, network off by default, timeout enforced.")}
    </p>
    <div class=form-row>
      <button class="btn btn-p" onclick="sbRun()">${_l("运行","Run")}</button>
      <button class="btn" onclick="sbSample()">${_l("示例","Sample")}</button>
    </div>
    <div class=form-row style="margin-top:8px">
      <label style="display:flex;align-items:center;gap:4px;font-size:12px"><input type="checkbox" id="sbNet"> ${_l("允许网络","Allow network")}</label>
      <label style="display:flex;align-items:center;gap:4px;font-size:12px">${_l("超时ms","Timeout ms")}<input type="number" id="sbTimeout" value="5000" style="width:90px"></label>
    </div>
    <div><textarea id="sbCode" rows=8 style="font-family:monospace" placeholder="${_l("在此输入 JavaScript…","Enter JS here…")}"></textarea></div>
    <div id="sbOut" style="margin-top:8px;padding:10px;background:var(--bg);border-radius:6px;font-family:monospace;font-size:12px;white-space:pre-wrap;max-height:300px;overflow:auto"></div>
  </div>`;
}
function sbSample(){
  const code = `// 沙箱示例：计算并调用 kbserve 全局
const items = [3, 7, 1, 9, 4];
const sum = items.reduce((a,b) => a+b, 0);
console.log("sum =", sum);
console.log("args.question =", __args && __args.question);
return { sum, count: items.length, random: Math.round(Math.random()*100) };`;
  document.getElementById("sbCode").value = code;
}
async function sbRun(){
  const code = document.getElementById("sbCode").value;
  if (!code) return;
  const out = document.getElementById("sbOut");
  out.textContent = _l("运行中…","Running…");
  const timeout = Number(document.getElementById("sbTimeout").value) || 5000;
  const allowNet = document.getElementById("sbNet").checked;
  const r = await post("/admin/sandbox/run", { code, timeout, allowNetworking: allowNet });
  let h = r.ok ? _l("✓ 成功","✓ OK") : _l("✗ 失败","✗ Failed");
  h += ` (${r.durationMs}ms)\n\n`;
  if (r.output) h += r.output + "\n\n";
  if (r.result !== undefined && r.result !== null) h += _l("返回值:","Result: ") + r.result + "\n";
  if (r.error) h += _l("错误:","Error: ") + r.error;
  out.textContent = h;
}

async function refreshMarketplace(){
  const box=document.getElementById("mpList");
  if(!box)return;
  box.innerHTML=`<div class=empty>${_l("加载中…","Loading…")}</div>`;
  const r=await get("/admin/marketplace/list");
  if(r.plugins&&r.plugins.length){
    let h=`<table><tr><th>${_l("名称","Name")}</th><th>${_l("版本","Ver")}</th><th>${_l("作者","Author")}</th><th>${_l("说明","Description")}</th><th>${_l("操作","Actions")}</th></tr>`;
    for(const p of r.plugins)h+=`<tr><td>${esc(p.name)}</td><td>${p.version}</td><td>${esc(p.author)}</td><td>${esc(p.description||"").slice(0,40)}</td><td><button class="btn btn-sm btn-p" onclick="installFromMp('${esc(p.repo)}')">${_l("安装","Install")}</button></td></tr>`;
    box.innerHTML=h+`</table>`;
  }else box.innerHTML=`<div class=empty>${_l("暂无可用插件","No plugins available")}</div>`;
}
async function installFromMp(repo){
  const r=await post("/admin/marketplace/install",{repo:repo||document.getElementById("mpRepo")?.value});

  if(r.ok)refreshMarketplace();
}

async function savePlatform(e,name){e.preventDefault();
  const cfg={};
  if(name==="telegram"){cfg.token=document.getElementById("plat-tg-token")?.value;cfg.webhookUrl=document.getElementById("plat-tg-webhook")?.value}
  if(name==="wechat"){cfg.appId=document.getElementById("plat-wx-appid")?.value;cfg.secret=document.getElementById("plat-wx-secret")?.value;cfg.token=document.getElementById("plat-wx-token")?.value}
  if(name==="feishu"){cfg.appId=document.getElementById("plat-fs-id")?.value;cfg.secret=document.getElementById("plat-fs-secret")?.value}
  if(name==="dingtalk"){cfg.appKey=document.getElementById("plat-dd-key")?.value;cfg.secret=document.getElementById("plat-dd-secret")?.value}
  if(name==="webhook"){cfg.url=document.getElementById("plat-wh-url")?.value}
  await post("/admin/platform/set",{name,config:cfg});
  alert(_l("已保存","Saved"));
}
