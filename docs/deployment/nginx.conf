upstream kbserve_backend {
    server 127.0.0.1:3090;
    keepalive 64;
}

# HTTP → HTTPS redirect (enable when SSL is configured)
# server {
#     listen 80;
#     server_name kbserve.example.com;
#     return 301 https://$host$request_uri;
# }

server {
    listen 80;
    # listen 443 ssl http2;  # uncomment when SSL is ready
    server_name kbserve.example.com;

    # SSL (uncomment and configure when SSL cert is obtained)
    # ssl_certificate     /etc/letsencrypt/live/kbserve.example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/kbserve.example.com/privkey.pem;
    # ssl_protocols TLSv1.2 TLSv1.3;
    # ssl_ciphers HIGH:!aNULL:!MD5;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
    gzip_min_length 256;
    gzip_vary on;
    gzip_proxied any;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=kbserve_api:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=kbserve_auth:10m rate=5r/s;

    # Logging
    access_log /var/log/nginx/kbserve_access.log combined buffer=64k flush=3s;
    error_log  /var/log/nginx/kbserve_error.log warn;

    # Large uploads (knowledge base documents)
    client_max_body_size 50M;
    proxy_request_buffering off;
    client_body_buffer_size 128k;

    # CORS headers
    add_header Access-Control-Allow-Origin  * always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization" always;
    add_header Access-Control-Expose-Headers "Content-Length,Content-Range" always;

    # Main API proxy
    location / {
        proxy_pass http://kbserve_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffering off;

        # Rate limit: API endpoints
        location /api/ {
            limit_req zone=kbserve_api burst=50 nodelay;
            proxy_pass http://kbserve_backend;
        }

        # Rate limit: auth endpoints
        location /auth/ {
            limit_req zone=kbserve_auth burst=10 nodelay;
            proxy_pass http://kbserve_backend;
        }
    }

    # WebSocket / SSE — no buffering, long timeout
    location /events {
        proxy_pass http://kbserve_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering off;
    }

    location /ws {
        proxy_pass http://kbserve_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering off;
    }

    # Static files (dashboard) — serve directly if needed
    location /dashboard/ {
        proxy_pass http://kbserve_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_cache_valid 200 302 10m;
        proxy_cache_valid 404 1m;
    }

    # Health check — no rate limit
    location /health {
        access_log off;
        proxy_pass http://kbserve_backend;
    }

    # Deny access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}